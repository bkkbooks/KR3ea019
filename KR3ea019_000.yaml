body:
  text: 總論陳無擇曰五運六氣乃天地陰陽運行升降之常道也五運流行有太過不及之異六氣升降有逆從勝復之差凡不合於德化政令者則為變眚皆能病人故經云六經波蕩五氣傾移太過不及專勝兼併所謂治化人應之也或遇變眚聿興災沴因郁發以亂其正常之德而致折傷復隨人臟氣虛實而為病者謂之時氣與夫感冒中傷天行疫診迥然不同前哲知夫天地有餘不足違戾之氣還以天地所生德味而平治之經論昭然人鮮留意恐成湮沒故敘而記之旭高按運氣證治方載於三因書系陳無擇編輯未知創自何人揆其大旨不出內經六淫治例與夫五臟苦欲補瀉之義假令風木之年而得燥金之年之病即從燥金之年方法求治發生之紀而得委和之紀之病即從委和之紀方法求治此其道也若謂其年必生某病必主某方真是癡人說夢矣三因司天運氣方一苓朮湯凡遇六壬年發生之紀歲木太過風氣流行脾土受邪民病飧泄食減體重煩冤腸鳴脅支滿甚則忽忽喜怒眩暈顛疾為金所復則反脅痛而吐血甚則衝陽絶者死茯苓白朮青皮炙草厚朴薑汁炒半夏炮姜草果各等分上㕮咀每服四錢水杯半姜三片棗二枚煎七分去滓空心溫服歌訣苓朮湯青甘朴夏炮姜草果棗姜加六壬之歲壬申壬午壬辰壬寅壬子壬戌六年發生紀木運太過曰發生木勝風淫土受邪飧泄腸鳴脅支痛苦溫甘淡治脾家方解木勝風淫則脾土受病而濕不運經曰脾苦濕急食苦以燥之濕淫於內治以苦溫佐以甘辛故用白朮厚朴草果炮薑半夏之苦辛溫以運脾燥濕用茯苓者所謂以淡泄之甘草者所謂以甘補之也惟用青皮一味之酸以瀉肝亦可曉然於肝邪之不可過伐矣仲景曰見肝之病知肝傳脾當先實脾尤在涇云肝邪盛者先實脾土以杜滋蔓之禍然則歲木太過民病飧泄而主以苓朮湯不治肝而治脾不治風而治濕謂非肝病實脾之一證乎二麥門冬湯凡遇六戊年赫曦之紀歲火太過炎暑流行肺金受邪民病痎瘧上氣咳喘咯血痰壅嗌乾耳聾肩背熱甚胸中痛脅支滿背髀並兩臂痛身熱骨疼而為浸淫為水所復則反譫妄狂越太淵絶者死麥冬桑白皮鍾乳粉人參紫菀白芷半夏甘草竹葉各等分煎服如上法歌訣麥門冬湯桑白皮鍾乳人參紫菀隨白芷半甘兼竹葉咳喘咯血此方推赫曦之紀火運太過曰赫曦年逢戊戊辰戊寅戊子戊戍戊申戊午六年火灼金傷肺病宜方解火淫熱勝則相傳之官受制而治節失司為咳喘上氣咯血肩背臂膊皆痛皆肺病也肺屬燥金而惡火火就燥燥火本為同類故肺受火刑為病與燥氣自傷無異所謂自傷氣之削也是方以麥冬補肺之陰鍾乳補肺之陽人參補肺之正氣此三味先為運籌帷幄保守中軍然後用桑皮紫菀之苦以泄之白芷半夏之辛以瀉之甘草緩之竹葉清之此數味者是為斬將搴旗之師也統而論之即經旨熱者寒之燥者潤之弱者補之強者瀉之調其氣而使其平此之謂也三附子山萸湯凡遇六甲年敦阜之紀歲土太過雨濕流行腎水受邪民病腹痛清厥意不樂體重煩冤甚則肌肉痿足痿不收腰膝痛中滿食減為風所復則反溏泄腸鳴大腹腫脹太溪絶者死附子山萸肉各一兩半夏肉果煨各三錢木瓜烏梅藿香丁香各一錢姜七片棗三枚水煎服如前法歌訣附子山萸半肉果瓜梅丁藿二香和再加薑棗治敦阜土運太過曰敦阜六甲之年土太過甲子甲戍甲申甲午甲辰甲寅六年濕勝陽微脾腎傷君以苦熱酸辛佐方解腹痛寒厥足痿不收濕傷脾腎之陽矣經言濕勝陽微治之以苦熱酸辛蓋苦能燥濕辛可理脾熱性剛而扶陽酸屬木而制土故也然腎肝同處下焦而脾與胃為表裡脾腎既受濕邪肝胃豈無波及故用附子之熱壯腎陽即用山萸之溫養肝陽用肉果之辛醒脾陽即用半夏之辛和胃陽少佐瓜梅之酸甘制敦阜之太過丁藿之辛香闢雨濕之陰氣更加薑棗以和之而邪有不卻者乎四牛膝木瓜湯凡遇六庚年堅成之紀歲金太過燥氣流行肝木受邪民病脅與少腹拘急痛目赤耳聾甚則咳逆肩背尻陰股膝䟰足皆痛為火所復則暴痛胠脅不可轉側甚而喘咳溢血太衝絶者死牛膝酒浸木瓜各一兩炙甘草五錢芍藥天麻菟絲子酒浸枸杞子各三錢黃松節二錢姜二片棗一枚杜仲薑汁炒三錢煎同前法歌訣牛膝木瓜杞菟草天麻芍藥仲薑棗六庚之歲庚午庚辰庚寅庚子庚戌庚申六年遇堅成金運太過曰堅成金行太甚肝傷燥燥屬陽邪肝主筋舒筋養血斯方好方解歲運太過燥氣傷肝燥乃陽邪傷肝之血肝傷苦急雖緩之者必以甘而入肝者惟酸故君牛膝木瓜之苦酸以入肝臣甘草之甘以緩肝甘酸相得便能化肝之液以滋筋血之燥仲景所謂肝之病補用酸助用苦益用甘味調之是也佐以白芍斂肝陰天麻平肝陽菟絲枸杞養肝血姜炒杜仲理肝氣蓋燥氣傷肝肝之陰血急宜培而肝之陽氣不宜亢也使以松節者松為木長其節多油能祛骨節之風燥肝屬木而主筋又同氣相求之理也統論全方在養血以舒筋則肝無燥急之苦矣五川連茯苓湯凡遇六丙年流衍之紀歲水太過寒氣流行邪害心火民病身熱煩躁譫妄手足厥冷甚則腹脹大喘咳上氣寢汗出憎風為土所復則反腹滿腸鳴溏泄渴妄神門絶者死川連茯苓各一兩麥冬車前子遠志薑汁製通草各半兩半夏黃芩炙甘草各一錢姜七片棗三枚煎服同前歌訣川連茯苓湯遠志車通麥夏草黃芩紀逢六丙丙寅丙子丙戍丙申丙午丙辰六年為流衍水運太過曰流衍寒水流行邪害心譫妄躁煩肢厥冷急清心主此宜斟方解身熱譫妄煩躁而手足厥冷顯然君主為寒水遏伏陽氣不得四布而坐令自焚故重用黃連之苦急清心經之焰內安君主茯苓之淡急泄流衍之水外御客邪麥冬黃芩甘草佐川連同致救焚之功半夏車前通草佐茯苓共成決瀆之功遠志開心竅用薑汁製之則能通神明而宣陽氣陽氣得宣水邪盡卻煩躁厥冷自己六蓯蓉牛膝湯凡遇六丁年委和之紀歲木不及燥乃盛行民病中清胠脅小腹痛腸鳴溏泄為火所復則反寒熱瘡瘍咳而鼽衄肉蓯蓉牛膝木瓜當歸白芍大熟地烏梅炙草各等分煎同前法如筋痿腳弱加鹿角屑同煎歌訣蓯蓉牛膝湯熟地歸芍瓜梅炙草比肝虛傷燥此方宜六丁之歲丁卯丁丑丁亥丁酉丁未丁巳六年委和紀木運不及曰委和胠脅少腹悉皆疼腳弱還加鹿角使方解此與前牛膝木瓜湯大段相同但彼因燥盛傷肝肝血雖虛不甚故止化肝之液養肝之血便可以卻燥此以肝虛傷燥血液大虧故用蓯蓉熟地峻補腎陰是虛則補母之法也七黃耆茯苓湯凡遇六癸年伏明之紀歲火不及寒乃盛行民病心胸中痛膺背兩臂內痛噎塞鬱冒暴喑甚則髖髀痛不能屈伸為土所復則反溏泄腸鳴腹痛手足痿痹不能任身黃耆茯苓紫河車遠志薑汁炒苡仁生研人參各等分肉桂心新增水煎服按此湯用河車當作丸劑為是歌訣黃耆茯苓湯人參河車遠志苡仁生歲火不足寒威盛六癸之年癸酉癸未癸巳癸卯癸丑癸亥六年是伏明火運不及曰伏明矇昧心胸疼痛服更加肉桂義尤精方解心陽衰少則君火無權故寒邪得以侵凌而來犯觀其暴喑矇昧心胸疼痛等證不徒寒威肆虐其義可繹思矣方中參耆河車並用大溫補其氣血俾氣血足而神旺則心陽自暢更用遠茯安神苡仁養心取意非不善但不無迂緩之嫌旭高因僭加桂心一味以宣導諸藥啓發心陽臨症取裁是所望於君子八白朮厚朴湯凡遇六己年卑監之紀歲土不及風氣盛行民病飧泄霍亂身重腹痛肉瞤筋軟善太息不嗜食為金所復則反胸脅暴痛下引少腹善怒吞酸食少白朮厚朴半夏青皮桂心藿香各三錢炮姜炙草各五錢姜三片棗二枚煎同前法歌訣白朮厚朴湯藿香青甘半夏炮乾薑桂心補火以生土六己之年己巳己卯己丑己亥己酉己未六年卑監方土運不及曰卑監泄瀉脾虛不嗜食溫中補土此為良方解此即六壬年苓朮湯去茯苓草果加藿香暢脾氣桂心補土母余則大段相同九紫菀湯凡遇六乙年從革之紀歲金不及炎火盛行民病咳逆上氣身熱咳衄汗出肩背臂痛為水所復則反頭腦痛及於頂發熱口瘡心痛紫菀人參甘草黃耆五味子白芍杏仁地骨皮桑白皮各等分水煎服歌訣紫菀人參味草耆杏仁地骨芍桑皮歲金不及名從革金運不及曰從革六乙之年乙丑乙亥乙酉乙未乙巳乙卯六年遇此奇上氣咳喘多汗出肺虛有火最相宜方解肺位高原職司下降肺虛而火熱乘之則反苦氣上逆經曰肺苦氣上逆急食苦以泄之故用紫菀杏仁之苦以降氣損其肺者益其氣故用人參黃耆以補氣咳逆汗多是肺氣耗散矣散者收之故用五味白芍以收肺收之亦以補之也肺之所畏者火而所賴以生者土也故用甘草瀉心火而除煩補脾土而生氣金有所恃矣然恐火鬱之久金傷特甚不能受補而反壅氣故用骨皮桑皮清之瀉之益知肺虛熱甚之證降氣補肺清金瀉火每相須為用也以上十方治五運大運太過不及逆從勝復為災者按運氣有三有大運主運客運大運者中運也主一歲之氣如甲己之歲土運統之乙庚之歲金運統之丙辛之歲水運統之丁壬之歲木運統之戊癸之歲火運統之是也主運者如春木屬角夏火屬徵秋金屬商冬水屬羽土寄四季屬宮春必始於角而冬則終於羽歲歲相仍者是也客運者十年一周各以本年中運為初運而以次相生如甲年陽土則太宮起初運己年陰土則少宮起初運乙年陰金則少商起初運庚年陽金則太商起初運丙年陽水則太羽起初運辛年陰水則少羽起初運丁年陰木則少角起初運壬年陽木則太角起初運戊年陽火則太徵起初運癸年陰火則少徵起初運五運不同迭相用事者是也三運之中俱有太少相生之異如甲丙戊庚壬五太之年為陽為太過其數應於成乙丁己辛癸五少之年為陰為不足其數應於生先聖察生成之數以求運氣者蓋欲因數以占夫氣化之盛衰而示人以法陰陽和術數先歲氣合天和也然而難言之矣一歲之中五運相推六氣相蕩運氣錯雜而變各不同如濕挾風而化燥風兼燥而化涼火燔亢而生風濕鬱蒸而為熱則陰陽之消息固難以識其微而形象之著明是必有可憑之理是故執司天以求治而其失在隘舍司天以求治而其失在浮嗟乎安得讀萬卷書明陰陽者與之共談斯言哉十一靜順湯治辰戌之年太陽司天太陰在泉氣化運行先天初之氣乃少陽相火加臨厥陰風木民病瘟癘身熱頭痛嘔吐肌腠瘡瘍二之氣乃陽明燥金加臨少陰君火民病氣鬱中滿三之氣乃太陽寒水加臨少陽相火民病寒反熱中身熱瞀悶四之氣厥陰風木加臨太陰濕土風濕交爭民病肉痿足痿注下赤白五之氣少陰君火加臨陽明燥金民病鬱郁不舒終之氣太陰濕土加臨太陽寒水民病悽慘治法宜用甘溫平其水酸苦補其火折其鬱氣資其化源抑其運氣扶其不勝也附子辛甘熱炮姜苦辛溫木瓜酸溫茯苓甘淡牛膝苦酸甘草甘平訶子苦溫防風甘辛溫自大寒至春分去附子加杞子自春分至小滿依原方加杞子自小滿至大暑去附子木瓜炮姜加人參杞子地榆白芷生薑自大暑至秋分依原方加石榴皮自秋分至小雪依原方不加減自小雪至大寒去牛膝加當歸白芍阿膠歌訣靜順湯醫辰戌年太陽寒水是司天附姜茯膝木瓜草訶子防風八味全隨氣初終加減服扶其不勝抑其偏方解按內經運氣篇太陽司天寒淫所勝太陰在泉濕淫所勝為病與此不同其治司天之寒淫平以辛熱佐以甘苦治在泉之濕淫主以苦熱佐以酸淡立方大意即本之此後俱仿此十二審平湯治卯酉之歲陽明司