至春分加牛蒡子自春分至小滿加麥冬山藥自小滿至大暑加紫菀自大暑至秋分加澤瀉山梔自秋分至小雪大寒並依原方歌訣厥陰巳亥用敷和風木司天土病多內經厥陰風木司天脾胃之病為多橘半草苓姜味枳棗仁訶子九般哦方解內經厥陰司天風淫所勝治以辛涼佐以苦甘少陽在泉火淫所勝治以鹹冷佐以苦辛此方辛涼鹹寒在加減法中而不入正方正方九味多是溫中補土益肺之藥蓋木盛者土必衰培土生金正所以抑木也以上六方治六氣之客氣為病者客氣遷移故法有加減其方意深奧有與病相合者有與病不相合者若必欲為強解未免昧心誣聖寧闕其義以俟明者按六氣有二一曰主氣一曰客氣主氣者節有常期歲有常令凡一歲之氣始於大寒日交風木之初氣次至春分日交君火之二氣次至小滿日交相火之三氣次至大暑日交濕土之四氣次至秋分日交燥金之五氣次至小雪日交寒水之終氣每氣各主六十日八十七刻半客氣者三陰三陽之氣更迭主時而行天令以加臨於主氣之上而為一歲之變化如子午年則太陽寒水為初氣丑未年則厥陰風木為初氣寅申年則少陰君火為初氣卯酉年則太陰濕土為初氣辰戍年則少陽相火為初氣巳亥年則陽明燥金為初氣以次而轉余可類推然主氣以五行相生為序故太陰濕土居少陽相火之後客氣以三陰三陽先後之數為序故太陰濕土居少陽相火之前也凡客氣所至則有寒暑燥濕風火非常之變故冬有爍石之熱夏有淒滄之涼和則生化不和則為災傷此蓋客氣所加乃為勝制郁發之變耳總而言之司天通主上半年在泉通主下半年析而言之六氣各有所主非其位則邪當其位則正氣相得則微不相得則甚千變萬化何有窮盡上凡一十六方不過示人以規矩耳病有萬變藥亦萬變圓機之士不須余贅矣附方五瘟丹韓氏醫通治瘟疫甘草甲己年土運甘草為君黃芩乙庚年金運黃苓為君黃柏丙辛年水運黃柏為君梔子丁壬年木運梔子為君黃連戊癸年火運黃連為君紫蘇香附上七味俱生用各等分凡為君者多一倍如甲己年甘草二兩余各一兩於冬至日擇淨室避婦女雞犬研為末用錦文大黃二兩濃煎去渣熬膏和藥為丸如嫌干少加蒸餅糊搗丸如彈子大硃砂雄黃為衣再加金箔外護凡病瘟疫用一丸冷水磨服並治諸瘡腫毒以此外敷無不神效歌訣五瘟丹紫蘇香附黃柏芩連梔草臨大黃煮汁丸如彈外護雄朱更貼金甲己之年君甘草丁壬梔子乙庚芩戊癸黃連丙辛柏除卻為君等分飲方解旭高曰運氣錯雜不得其正人在氣交之中受其不正之氣則瘟病生瘟之為病雖有五運之分要皆必有熱毒蓋瘟癘鬱蒸則成熱互相傳染則成毒也故喻嘉言張路玉葉天士輩治療瘟疫清理三焦均必佐以解毒此方即黃連解毒湯合香附飲加味為丸其分兩則隨五運而增減以治五種瘟疫義亦精矣蓋香附紫蘇芳香辛散足以辟邪硃砂雄黃金箔得天地陰陽精靈之氣足以正不正之氣餘五味總言其功清熱解毒分言其妙則甘草入脾用以為君能領諸藥瀉土中之火黃芩入肺用以為君能領諸藥瀉金中之火故甲己土運甘草為君乙庚金運黃芩為君余可類推矣薑桂湯古方選注治戊午年少陰君火太乙天符歲會民病無論三因舌苔盡白火勝水復宜此治之老生薑汁三錢沖肉桂二錢四分去皮人參三錢當歸二錢四分南棗三枚水二鍾煎八分衝入薑汁分三服隨時服歌訣薑桂湯用薑汁桂人參南棗當歸繼太乙天符戊午年天符者中運與司天相符也太乙者戊為火運午為火支又值少陰君火司天三火相合故曰太乙天符也火亢害則水承製經曰亢則害承乃制謂火極反兼水化也無論三因內因外因不內外因舌白苔宜此通營以泄衛一隅三反望後賢莫謂司天無足系方解王晉三曰傷寒臟結症舌上白苔滑者難治戒之不可攻而舌鑑論白苔十九症皆用汗下辛熱之法余閲歷多年未有能治之者戊午歲少陰君火太乙天符自春徂秋民病無論三因舌胎白者居多有白滑白屑白粉之異原其義即至真要大論熱勝寒復熱極反兼勝己之化也用炮薑附子則白胎厚而液燥用芩連則手足冷而陽脫余尋思舌為心之外候其色當赤白為肺之色反加心火之上是侮其所勝顯系寒邪入肺鬱蒸見於舌是衛實營虛乃以大劑生薑汁泄衛肉桂通營人參當歸南棗助營衛之正氣服之皆應手而愈名之曰薑桂湯宗仲景心營肺衛立方也旭高按王氏此方不從內經六淫治例而別出心裁又與司天勝復之義吻合蓋少陰司天熱淫寒復即不當從熱淫起見當以寒淫為治經曰寒淫於內治以甘熱佐以苦辛此法是矣舉一三反是望後賢莫謂司天一道與藥無關而勿之思也附司天運氣圖歌司天運氣最難明暢司天有左右間氣之別天符歲會之殊五運有主客之異六氣亦有主客之分內經言之雖詳而初學之家終莫知其要領今特繪圖於下使觀者一覽分明且系之以歌便於記誦為補豈淺鮮哉司天歌子午少陰為君火丑未太陰臨濕土寅申少陽相火王卯酉陽明燥金所辰戌太陽寒水邊巳亥厥陰風木主初氣起地之左間司天在泉對面數解釋司天在泉四間氣者客氣之六步也凡主歲者為司天位當三之氣司天之下相對者為在泉位當終之氣司天之左為天之左間右為天之右間在泉之左為地之左間右為地之右間每歲客氣始於司天前二位乃地之左間是為初氣以至二氣三氣而終於在泉之六氣每客各主一步故六微旨大論曰天道六六之節上下有位左右有紀故少陽之右陽明治之陽明之右太陽治之太陽之右厥陰治之厥陰之右少陰治之少陰之右太陰治之太陰之右少陽治之此言客氣陰陽之次序也然司天通主上半年在泉通主下半年故又曰歲半以前天氣主之歲半以下地氣主之也主運歌主運初角終於羽太少相生五音譜木為初運大寒交火二春分十三數土三芒種後十日金四處暑七日取水為終運立冬交冬後四日交之部每運七十三日零共得三百六十五解釋假如甲年為陽土運屬太宮用事而上推至初運之角則其生太宮者少徵也生少徵者太角也是以甲之主運起太角太少相生而終於太羽餘年仿此此為每歲之常令也六元正紀大論曰夫五運之化或從天氣或逆天氣或從天氣而逆地氣或從地氣而逆天氣或相得或不相得又曰先立其年以明其氣金木水火土運氣之數風寒暑濕燥火臨御之紀則天地可見民病可調此經文明言五運之化有常數主客之運有逆順也蓋六氣有主客五運亦有主客主運皆起於角而以次下生每歲三百六十五日二十五刻以五分之則每運得七十三日零五刻也客運歌十干客運何行起甲巳之年初運宮乙庚商兮丙辛羽丁壬角與主相同丁壬客運初於角與主運同戊癸以徵為初運太少相生直至終解釋客運者亦一年五步每步各得七十三日零五刻五運以土為尊故甲巳年起於土運甲屬陽土為太宮已屬陰土為少宮故甲年則太宮為初運太生少故少商為二運少又生太故太羽為三運太又生少故少角為四運少又生太故太徵為終運巳年則少宮陰土為初運少宮生太商為二運太商生少羽為三運少羽生太角為四運太角生少徵為終運太少相生凡十年一主令而竟天干也但主運必春始於角而終於羽客運則以本年中運為初運而以次相生此主客運之所以有異也客運加於主運之上有生克邪正之變而病作矣主氣歌主氣分布主四時歲歲如常故曰主厥陰風木大寒初少陰君火春分二少陽相火小滿三太陰濕土大暑四秋分交著五之氣五氣陽明燥金是節交小雪六氣周太陽寒水終之次解釋四時六氣節有常期溫暑涼寒歲有常令每氣各主六十日八十七刻半是謂六步每步中各有節序四氣是為二十四氣而所以節分六步者也總六步而得三百六十五日二十五刻以成一歲故六微旨大論曰顯明之右君火之位也君火之右退行一步相火治之復行一步土氣治之復行一步金氣治之復行一步水氣治之復行一步木氣治之正以言六步之主氣也大寒日交風木之初氣春分日交君火之二氣小滿日交相火之三氣大暑日交濕土之四氣秋分日交燥金之五氣小雪日交寒水之終氣客氣歌逐年客氣加臨異不與年常主氣比子午之年寒水初木二火三土居四相火五兮燥金終仿此推之理一致丑未初氣風木同寅申初氣君火主卯酉初氣濕土臨辰戌初氣相火至巳亥初氣屬燥金六載一周終復始一言重復告君知濕土相火更位次主為地氣分五行土居火後相生理客為天氣法陰陽土在火先此所以客氣加臨無定時主但奉行天令耳故凡主客氣相臨有勝無復須當視司天克運其病徐運克司天其病厲利害攸關運氣多古來誰把南針指類經圖翼頗精詳余作斯歌得其旨解釋如子午年則太陽為初氣厥陰為二氣少陰值司天為三氣太陰為四氣少陽為五氣陽明為終氣丑未年則厥陰為初氣以次為轉餘年可仿此類推矣主氣以風木為初氣此丑未年之客氣亦風木為初氣與主氣同也主氣者地氣也在地成形靜而守位謂木火土金水分主四時而司地化以為春夏秋冬歲之常令者是也然主氣以五行相生為序而太陰土所以居少陽火之後也客氣者天氣也在天為氣動而不息乃為天之陰陽分司天在泉左右四間之六氣者是也故三陽三陰之氣更迭主時而行天令以加臨於主氣之上而為一歲之變化然客氣以陰陽先後之數為序故太陰土所以居少陽火之前也客氣為先天之氣主氣為後天之氣先天而天勿違後天而奉天時故客氣有不時之加臨而主氣則只當奉行天令耳客氣加臨於主氣之上但有客氣之勝而無主氣之復正以主氣奉行天令故也司天在上在泉在下中運居中通主一歲如司天克中運謂之以上臨下其病徐而微假如庚午年少陰君火司天而中運屬金是也運氣克司天謂之以下臨上其病暴而甚假如丙子年少陰君火司天而中運屬水是也上臨下為順故病輕下臨上為逆故病重在泉亦然張介賓類經圖翼論運氣甚詳此歌多集其義天符歲會總歌天符中運同天氣太乙全兼運會支歲會運支須四正辰戌丑未亦相宜同天同歲泉同運陰歲陽天不必疑解釋天符者中運與司天相符也如木運之歲上見厥陰火運之歲上見少陽少陰土運之歲上見太陰金運之歲上見陽明水運之歲上見太陽者是也太乙天符者如戊午年以火運火支又見少陰君火司天是天氣運氣歲支三者俱會乃為太乙天符也歲會者乃中運之氣與歲支相同者是也如木運臨卯火運臨午土運臨四季金運臨酉水運臨子所謂歲會氣之平也不分陰年陽年但取四正之支與運相合乃為四直承歲四正支者子午卯酉是也如辰戍丑未四年土無定位寄旺於四時之末各十八日有奇則亦通論歲值也同天符同歲會者中運之氣與在泉相合也陽年曰同天符陰年曰同歲會如甲辰年陽土運而太陰在泉則為同天符癸卯年陰火運而少陰在泉則為同歲會又天符歌執法天符十二年若除太乙八年編觀天符圖自明丙辰丙戌兼丁巳丁亥還同戊子聯戊寅戊申更乙卯中其邪者速危傳解釋經曰天符為執法共十二年經曰中執法者其病速而危以執法者之權重也又太乙天符歌太乙天符為貴人戊午己丑己未辰更同乙酉年凡四若中其邪暴喪身解釋經曰太乙天符為貴人中貴人者其病暴而死以三氣皆傷故也又歲會歌經云歲會為行令丙子年同丁卯春又有甲辰與甲戌中傷行令病徐循解釋歲會共計八年而四年同於天符是即太乙天符也故止四年為真歲會經曰歲會為行令中其令者其病徐而持以行令者之權輕也司天在泉六淫治例風淫治以辛涼佐以苦甘以甘緩之以辛散之熱淫治以鹹寒佐以甘苦以酸收之以苦發之濕淫治以苦熱佐以酸淡以苦燥之以淡泄之火淫治以鹹冷佐以苦辛以酸收之以苦發之燥淫治以苦溫佐以甘辛以苦下之寒淫治以甘熱佐以苦辛以咸瀉之以辛潤之以苦堅之六淫勝復治例寒者熱之微隨之逆之熱者寒之衰補之散收之燥潤之溫者涼之強瀉之結散之急緩之涼者溫之甚制之從之六淫治法歌風淫於內治辛涼佐以苦甘緩辛散熱淫鹹寒佐甘苦酸收苦發相參贊濕淫苦熱佐酸淡苦燥淡泄斯斷斷火淫鹹冷佐苦辛苦發酸收與熱貫燥淫於內治苦溫佐以甘辛苦下看寒淫甘熱苦辛佐咸瀉辛潤苦堅玩治諸勝復當逆從溫清寒熱醫毋亂五臟苦欲補瀉法大段相同微有判此卷專為運氣言不編雜法君須按解釋風乃陽邪金能勝木風淫於內故治以辛涼辛過甚恐傷氣故佐以苦甘苦勝辛甘益氣也木性急故以甘緩之木喜條達故以辛散之水勝火寒勝熱熱淫於內故治以鹹寒甘勝咸佐之以防其太過也心苦緩故以酸收之熱鬱於內故以苦發之也苦熱能燥濕酸木能制土淡能利水吳鶴皋曰使酸而非淡則味厚滋濕矣泄者滲利與汗也鹹冷亦水勝火也苦能泄熱辛能散能潤苦發酸收與治熱淫同火能勝金故治以苦溫甘能致津辛可潤燥故佐以甘辛燥熱內結以苦瀉之可也土能勝水熱能勝寒故治以甘熱苦而辛亦熱品也傷寒內熱者以咸瀉之腎苦燥以辛潤之腎欲堅以苦堅之也微者逆之甚者從之逆者正治也從者反治也五常正大論曰治熱以寒溫而行之治寒以熱涼而行之此即熱因寒用寒因熱用之謂五臟苦欲補瀉治例及五郁之法與此六淫勝復之治大段相同而微有分別但此卷專為運氣治法而設故不編雜法以滋擾亂也
